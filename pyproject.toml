[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "comfy-mcp-lite"
version = "0.3.0"
description = "轻量 ComfyUI MCP 服务器：用已有工作流生图（HTTP /mcp + Bearer 鉴权）"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2,<3",
    "websockets>=13",
    "pydantic>=2.7",
    "uvicorn>=0.30",
    # 仅用其 comfy_cli.workflow_to_api.convert_ui_to_api（UI 格式 → API 格式转换），
    # 不使用其 CLI。版本钉死为 B 机已验证版本。
    "comfy-cli==1.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "python-multipart>=0.0.9", # 测试用假 ComfyUI 解析 multipart 上传
]

[project.scripts]
comfy-mcp-lite = "comfy_mcp_lite.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
